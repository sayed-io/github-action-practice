# What is the goal of your workflow 
# Goal : Whenever someone changes he python code, 
# the liner will check if the syntac, format isindentation (linting  ) is correct or not 
name: Auto Linter
on: 
  push:
    paths: "*.py"
jobs: 
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/clone the code
      # This will automatically clone the code  instead of using the (git clone) here, use the (uses: actuion@checkoutv4)    
        uses: actions/checkout@v4
      # This will isntall python  
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # Specify exact version or range (e.g., '3.x')   
        # This will install the linter tool
      - name: Install Linter
        run: pip install ruff
        # This will  run the linter
      - name: Fix the code automatically background
        run: ruff check . --fix
             
      - name: Formate the code automatically
        run : ruff format --check .
      - name: Check the files for linting
        run: ruff check .
