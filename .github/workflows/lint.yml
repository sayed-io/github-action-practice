# What is the goal of your workflow 
# Goal : Whenever someone changes he python code, 
# the liner will check if the syntac, format isindentation (linting  ) is correct or not 
name: Auto Linter
on: 
  push:
    paths: "*.py"
jobs: 
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/clone the code
      # This will automatically clone the code  instead of using the (git clone) here, use the (uses: actuion@checkoutv4)    
        uses: actions/checkout@v7
        # Thsi will install the linter tool
      - name: Install Linter
        run: pip install ruff
        # Thsi will  run the linter
      - name: Check the files for linting
        run: ruff check .
