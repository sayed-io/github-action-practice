# In central repository .github/workflows/reusable-build.yaml
name: action
on:
  workflow_dispatch:
    

jobs:
  code:   
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Cloning he Code"
    

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v1
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install black flake8 isort

      - name: Run linters with auto-fix
        uses: wearerequired/lint-action@v3
        with:
          auto_fix: true
          black: true
          black_auto_fix: true
          flake8: true
          flake8_auto_fix: false
          isort: true
          isort_auto_fix: true

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run Ruff Check
        uses: chartboost/ruff-action@v1
        with:
          args: --check .

      - name: Run Ruff Fix
        uses: chartboost/ruff-action@v1
        with:
          args: --fix .

  build:
    needs: [ code, lint, ruff ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building the code"
  
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Testing the Code"
  
  deploy:
    needs: [ build,test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying hte Code"
