name: action

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - '**/*.py'

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Ruff
        run: pip install ruff
      
      - name: Fix Import Sorting
        run: ruff check --select I --fix .

      - name: Run Ruff Check
        run: ruff check .

      - name: Check Ruff Formatting
        run: ruff format --check .

      - name: Fix Ruff Issues
        run: ruff check --fix .
  
      - name: Check Ruff
        run: ruff check .
  
      - name: Fix Formatting
        run: ruff format .
  
      - name: Verify Formatting
        run: ruff format --check .
    

        

  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the code
        run: echo "Building the Code"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test the code
        run: echo "Testing the Code"

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy the code
        run: echo "Deploying the Code"
