name: action

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - '**/*.py'

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone the code
        run: echo "Cloning the Code"
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: install Ruff
        run: pip install ruff

      - name: Run Ruff Check
        uses: chartboost/ruff-action@v1
        with:
          args: check .

      - name: Check Ruff Formatting
        uses: chartboost/ruff-action@v1
        with:
          args: format --check .

  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the code
        run: echo "Building the Code"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test the code
        run: echo "Testing the Code"

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy the code
        run: echo "Deploying the Code"
